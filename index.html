<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat UI</title>
<style>
body {margin:0; background:#0b0f19; font-family:Arial; color:white; display:flex; justify-content:center; align-items:center; height:100vh;}
.chat-box {width:380px; height:550px; background:#10182f; border-radius:14px; box-shadow:0 0 20px rgba(0,0,0,.4); display:flex; flex-direction:column;}
.chat-header {padding:16px; background:#131b36; border-radius:14px 14px 0 0; font-size:20px;}
.chat-body {flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px;}
.msg {max-width:70%; padding:10px 12px; border-radius:10px;}
.incoming {background:#1f2a4a; align-self:flex-start;}
.outgoing {background:#4f46e5; align-self:flex-end;}
.chat-input {display:flex; padding:10px; gap:8px;}
.chat-input input {flex:1; padding:10px; border-radius:8px; border:none; outline:none;}
.chat-input button {padding:10px 16px; border:none; border-radius:8px; background:#4f46e5; color:white; cursor:pointer;}
</style>
</head>
<body>


<div class="chat-box">
<div class="chat-header">Social Chat</div>


<div class="chat-body" id="chatArea">
<div class="msg incoming">Hey! 👋</div>
<div class="msg outgoing">Hello! How are you?</div>
</div>


<div class="chat-input">
<input type="text" id="msgInput" placeholder="Type a message...">
<button onclick="sendMsg()">Send</button>
</div>
</div>


<script>
function sendMsg(){
const input = document.getElementById('msgInput');
const chat = document.getElementById('chatArea');
if(input.value.trim() === '') return;
const div = document.createElement('div');
div.className = 'msg outgoing';
div.innerText = input.value;
chat.appendChild(div);
chat.scrollTop = chat.scrollHeight;
input.value = '';
}
</script>


</body>
</html>
